name: Checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Unit tests, type check, formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # package.json pins yarn 4 through packageManager, so let Corepack provide it.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Unit tests
        run: yarn test:unit --run

      - name: Type check
        run: yarn check

      - name: Formatting
        run: yarn format:check

      # ESLint is not wired in yet: `yarn lint` has 17 errors on main, tracked in
      # https://github.com/thani-sh/craft-console/issues/4
